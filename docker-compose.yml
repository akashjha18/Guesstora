services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-this-secret-before-production
      MYSQL_DATABASE: cafe_loyalty
    ports:
      - "3306:3306"
    volumes:
      - perkbyte_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./server:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: change-this-secret-before-production
      MYSQL_DATABASE: cafe_loyalty
      JWT_SECRET: change-this-secret-before-production
      CLIENT_URL: http://localhost:5173
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./client:/app
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  perkbyte_data:
